# Recreates the Render free-tier dev database when it expires, repoints the
# deployed backend at it, redeploys and reseeds.
#
# Anyone with permission to run this workflow can recover the dev environment
# without ever holding a Render API key: the key lives in repository secrets and
# is only ever read by the runner.
#
# Setup (once):
#   1. Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret
#      Name: RENDER_API_KEY   Value: rnd_...   (https://dashboard.render.com/u/settings#api-keys)
#   2. Optional but recommended — Settings ▸ Environments ▸ New environment
#      named "dev-database" with required reviewers, so rotations need approval.

name: Rotate dev database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rotate" to confirm this destroys the current dev database'
        required: true
        default: ''
      dry_run:
        description: 'Show the plan without changing anything'
        type: boolean
        default: false
      seed:
        description: 'Reseed the database after creating it'
        type: boolean
        default: true
      data_density:
        description: 'Seed volume'
        type: choice
        options: [default, sparse, dense]
        default: default

# Never let two rotations race — the second would delete the database the first
# just created.
concurrency:
  group: rotate-dev-db
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev-database

    steps:
      - name: Validate confirmation
        if: ${{ !inputs.dry_run && inputs.confirm != 'rotate' }}
        run: |
          echo "::error::You must type 'rotate' in the confirm field to proceed."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rotate database
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          # Optional overrides; the committed config.json covers the normal case.
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_SERVICE_NAME: ${{ vars.RENDER_SERVICE_NAME }}
          DATA_DENSITY: ${{ inputs.data_density != 'default' && inputs.data_density || '' }}
        run: |
          node scripts/render-db/cli.mjs rotate \
            --yes \
            --timeout 20 \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.seed && ' ' || '--no-seed' }}

      - name: Report failure
        if: failure()
        run: |
          {
            echo "### Rotation failed"
            echo ""
            echo "Check the log above. Common causes:"
            echo "- \`RENDER_API_KEY\` missing, expired, or lacking access to the workspace"
            echo "- The database name in \`scripts/render-db/config.json\` no longer matches Render"
            echo "- Render still provisioning — re-run; the script is safe to retry"
          } >> "$GITHUB_STEP_SUMMARY"
